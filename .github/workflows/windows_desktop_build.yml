name: Build Windows Desktop App

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Desktop (MSI & Distributable)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build Windows Distributable & MSI Package
        run: ./gradlew :desktopApp:packageMsi :desktopApp:createDistributable --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload Windows MSI Installer
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Windows-MSI
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

      - name: Upload Portable Windows App
        uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Windows-Portable
          path: desktopApp/build/compose/binaries/main/app/
          if-no-files-found: warn
